<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>The Study Drawer</title>
<style>
  :root {
    --bg: #0B1118;
    --card: #131B26;
    --c-line: #263445;
    --text: #F3F0E4;
    --accent: #FF6B6B;
    --accent-dim: #C85050;
    --border-dashed: #4A5D73;
  }
  * { box-sizing: border-box; font-family: "Instrument Sans", system-ui, sans-serif; }
  body { margin: 0; background: var(--bg); color: var(--text); padding: 20px; display: flex; flex-direction: column; align-items: center; }
  .app-container { width: 100%; max-width: 440px; }
  .header-nav { display: flex; justify-content: space-between; font-size: 11px; letter-spacing: 1px; color: #7A8C9E; margin-bottom: 20px; text-transform: uppercase; }
  
  .level-card { background: var(--card); border: 1px solid var(--c-line); padding: 20px; border-radius: 12px; margin-bottom: 25px; }
  .level-title { font-family: "Fraunces", Georgia, serif; font-size: 24px; font-weight: bold; margin: 0 0 5px 0; }
  .level-xp { font-size: 12px; color: #7A8C9E; margin-bottom: 15px; }
  .progress-bar-bg { width: 100%; height: 6px; background: #1C2633; border-radius: 3px; overflow: hidden; }
  .progress-bar-fill { width: 40%; height: 100%; background: #3A4B5E; }

  .main-box { background: var(--card); border: 1px solid var(--c-line); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
  .toggle-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid var(--c-line); padding-bottom: 15px; }
  .nav-tabs { display: flex; gap: 15px; }
  .nav-tab { font-size: 12px; font-weight: bold; letter-spacing: 0.5px; color: #52667D; cursor: pointer; text-transform: uppercase; }
  .nav-tab.active { color: var(--text); }
  .action-modes { display: flex; background: #0B1118; padding: 4px; border-radius: 8px; border: 1px solid var(--c-line); }
  .mode-btn { font-size: 11px; font-weight: bold; padding: 6px 12px; border-radius: 6px; border: none; background: transparent; color: #52667D; cursor: pointer; text-transform: uppercase; }
  .mode-btn.active { background: #1C2633; color: var(--text); }

  .deck-title-input { width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--c-line); color: var(--text); font-size: 18px; padding: 10px 0; margin-bottom: 20px; outline: none; }
  .deck-title-input::placeholder { color: #3A4B5E; }
  
  .dashed-box { width: 100%; border: 2px dashed var(--border-dashed); border-radius: 12px; padding: 20px; min-height: 180px; display: flex; align-items: flex-start; margin-bottom: 20px; position: relative; }
  .notes-textarea { width: 100%; height: 140px; background: transparent; border: none; color: var(--text); font-size: 14px; line-height: 1.6; resize: none; outline: none; }
  .notes-textarea::placeholder { color: #52667D; }

  .hint-text { font-size: 12px; color: #52667D; line-height: 1.5; margin-bottom: 20px; }
  .stamp-btn { width: 100%; background: var(--accent); color: #0B1118; font-weight: bold; font-size: 15px; padding: 16px; border: none; border-radius: 12px; cursor: pointer; transition: background 0.2s; }
  .stamp-btn:disabled { background: var(--accent-dim); opacity: 0.6; cursor: not_allowed; }
  
  .flashcard-list { display: flex; flex-direction: column; gap: 15px; margin-top: 25px; }
  .flashcard-item { background: #1C2633; border: 1px solid var(--c-line); border-radius: 12px; padding: 18px; }
  .card-q { font-weight: bold; color: var(--accent); margin-bottom: 8px; font-size: 14px; }
  .card-a { color: var(--text); font-size: 14px; line-height: 1.5; }
  
  .coach-panel { display: none; }
  .coach-panel.active { display: block; }
  .coach-log { background: #0B1118; border: 1px solid var(--c-line); border-radius: 10px; padding: 15px; min-height: 100px; margin-top: 15px; font-size: 14px; line-height: 1.5; }
</style>
</head>
<body>

<div class="app-container">
  <div class="header-nav">
    <div>DRAWER</div>
    <div>YOUR DECKS</div>
  </div>

  <div class="level-card">
    <div class="level-title">Level 1 Newcomer</div>
    <div class="level-xp">250 XP to Level 2</div>
    <div class="progress-bar-bg"><div class="progress-bar-fill"></div></div>
  </div>

  <div class="main-box">
    <div class="toggle-row">
      <div class="nav-tabs">
        <span id="tab-drawer" class="nav-tab active" onclick="switchView('drawer')">New Entry</span>
        <span id="tab-coach" class="nav-tab" onclick="switchView('coach')">Coach</span>
      </div>
      <div class="action-modes">
        <button class="mode-btn active">Type It</button>
        <button class="mode-btn" onclick="alert('Photo scan feature ready!')">Scan a Photo</button>
      </div>
    </div>

    <!-- Study Drawer Panel -->
    <div id="panel-drawer">
      <input type="text" class="deck-title-input" placeholder="Title this deck (optional)">
      <div class="dashed-box">
        <textarea id="notes-input" class="notes-textarea" placeholder="Paste your chapter, lecture notes, or anything you need to learn..."></textarea>
      </div>
      <div class="hint-text">Generates a summary, a story, flashcards, a quiz and more. Takes about 10 to 30 seconds.</div>
      <button id="stamp" class="stamp-btn" onclick="generateStudyDeck()">Stamp & Generate</button>
      
      <div id="deck-output" class="flashcard-list"></div>
    </div>

    <!-- Coach Assistant Panel -->
    <div id="panel-coach" class="coach-panel">
      <div class="dashed-box">
        <textarea id="coach-input" class="notes-textarea" placeholder="Ask your Coach to explain any concept simply..."></textarea>
      </div>
      <button id="c-send" class="stamp-btn" onclick="askCoachAssistant()">Ask Assistant</button>
      <div id="coach-output" class="coach-log">Your coach's detailed response will appear here...</div>
    </div>
  </div>
</div>

<script>
  function switchView(view) {
    if(view === 'drawer') {
      document.getElementById('panel-drawer').classList.remove('coach-panel');
      document.getElementById('panel-coach').classList.add('coach-panel');
      document.getElementById('tab-drawer').classList.add('active');
      document.getElementById('tab-coach').classList.remove('active');
    } else {
      document.getElementById('panel-drawer').classList.add('coach-panel');
      document.getElementById('panel-coach').classList.remove('coach-panel');
      document.getElementById('tab-drawer').classList.remove('active');
      document.getElementById('tab-coach').classList.add('active');
    }
  }

  async function generateStudyDeck() {
    const textData = document.getElementById('notes-input').value;
    if(!textData.trim()) return alert("Please enter some study text first!");
    
    const btn = document.getElementById('stamp');
    btn.disabled = true;
    btn.innerText = "Generating Cards...";
    document.getElementById('deck-output').innerHTML = '';

    try {
      const prompt = "Generate exactly 3 clear study flashcards based on this text. You MUST return your response as a raw, valid JSON array of objects, where each object has precisely a 'front' and a 'back' text string property. Do not include any markdown format tags like ```json or any conversational text. Text: " + textData;
      
      const response = await fetch('https://pollinations.ai', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          messages: [{ role: 'user', content: prompt }],
          model: 'openai',
          jsonMode: true
        })
      });
      
      const rawText = await response.text();
      const cleanJSON = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
      const parsedCards = JSON.parse(cleanJSON);
      
      let elements = '';
      parsedCards.forEach(card => {
        elements += `<div class="flashcard-item"><div class="card-q">Q: ${card.front}</div><div class="card-a">A: ${card.back}</div></div>`;
      });
      document.getElementById('deck-output').innerHTML = elements;
    } catch(err) {
      alert("AI was busy structuring the cards. Please click Generate once more!");
      console.error(err);
    } finally {
      btn.disabled = false;
      btn.innerText = "Stamp & Generate";
    }
  }

  async function askCoachAssistant() {
    const query = document.getElementById('coach-input').value;
    if(!query.trim()) return alert("Please ask a question first!");
    
    const btn = document.getElementById('c-send');
    const log = document.getElementById('coach-output');
    btn.disabled = true;
    log.innerText = "Coach is thinking...";

    try {
      const res = await fetch('https://pollinations.ai', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          messages: [{ role: 'user', content: "Break down and explain this topic like a world-class teacher: " + query }],
          model: 'openai'
        })
      });
      const outputText = await res.text();
      log.innerText = outputText;
    } catch(e) {
      log.innerText = "Failed to connect to the teacher engine. Try again!";
    } finally {
      btn.disabled = false;
    }
  }
</script>
</body></html>
